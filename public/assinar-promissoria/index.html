<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Assinar nota promissória</title>
  <style>
    body{margin:0;background:#edf2ee;color:#16231b;font:16px/1.45 system-ui,sans-serif}
    main{max-width:760px;margin:auto;padding:16px}
    h1{font-size:1.5rem}
    canvas{display:block;box-sizing:border-box;width:min(100%,480px);height:auto;margin:10px 0;background:#fff;border:1px solid #355845;touch-action:none}
    button{font:inherit;padding:10px 14px;border:1px solid #154423;border-radius:6px;color:#154423;background:white;cursor:pointer}
    button[type=submit]{background:#154423;color:white}
    form{margin:16px 0}
    .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    [hidden]{display:none!important}
  </style>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <h1>Assinar nota promissória</h1>
    <div id="documento"></div>
    <form hidden>
      <label for="assinatura">Desenhe sua assinatura</label>
      <canvas id="assinatura" width="800" height="200"></canvas>
      <label><input type="checkbox" required> Li e concordo com a promissória acima.</label>
      <div class="actions">
        <button type="button" id="limpar">Limpar assinatura</button>
        <button type="submit">Confirmar assinatura</button>
      </div>
    </form>
    <p id="status" role="status">Carregando promissória…</p>
    <button type="button" id="salvar" hidden>Salvar PDF assinado</button>
  </main>
</body>
</html>
