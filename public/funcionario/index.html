<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Acesso do funcionário — Sistema de Madeiras</title><link rel="stylesheet" href="/plataforma/style.css"><style>.password-field{position:relative}.password-field input{padding-right:58px}.password-field button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:44px;min-height:44px;margin:0;padding:10px;display:flex;align-items:center;justify-content:center;background:transparent;color:#245d42;border:0}.password-field svg{width:24px;height:24px}.password-field button:focus-visible{outline:2px solid #245d42;outline-offset:1px}#forgot-password{display:block;background:transparent;border:0;text-decoration:underline;color:#245d42;padding:8px 0}</style></head><body>
<main class="login"><div class="brand">SM <span>SISTEMA DE MADEIRAS</span></div><h1>Ative seu acesso de funcionário.</h1><p>Use o e-mail informado ao administrador. Após confirmar seu e-mail, você poderá acessar as áreas liberadas para sua conta.</p>
<form id="register-form"><label>Seu e-mail<input id="email" type="email" autocomplete="username" required></label><label for="password">Senha</label><div class="password-field"><input id="password" type="password" autocomplete="new-password" minlength="8" required><button id="toggle-password" type="button" aria-label="Mostrar senha" aria-controls="password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="password-slash" d="M3 3 21 21" hidden/></svg></button></div><label>Como deseja entrar?<select id="mode"><option value="create">Criar minha conta</option><option value="login">Já tenho conta</option></select></label><button id="submit">Continuar cadastro</button></form>
<button id="forgot-password" type="button">Esqueci minha senha</button>
<div id="verification" hidden><p>Enviamos uma confirmação ao seu e-mail. Abra o link recebido e depois volte aqui.</p><button id="confirm">Já confirmei meu e-mail</button><button id="resend" class="secondary">Reenviar confirmação</button></div>
<p id="status" role="status" aria-live="polite"></p><a id="open-system" href="/" hidden>Abrir meu sistema →</a><button id="change-account" class="secondary" hidden>Usar outra conta</button></main>
<script type="module" src="/funcionario/app.mjs?v=1"></script></body></html>
