<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento do plano — SM</title><link rel="stylesheet" href="/plataforma/style.css"><style>main{max-width:760px;margin:auto;padding:20px}article{margin:16px 0}label{display:block;margin:14px 0}input[type=checkbox]{width:auto}button,a.button{margin:6px 6px 6px 0}#status{white-space:pre-line}[hidden]{display:none!important}</style></head><body><main><a href="/">← Voltar ao sistema</a><h1>Pagamento do plano</h1><p>Pagamento real avulso. Você decide quando renovar. Sem débito automático.</p><section id="login"><form id="login-form"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section><section id="billing" hidden><h2 id="company"></h2><article id="configuration" role="status"></article><article id="period" hidden></article><article><h2>Escolha seu plano</h2><label>Plano<select id="plan"></select></label><p id="price"></p><p><a id="terms" target="_blank" rel="noopener" hidden>Ler os termos da contratação</a></p><label><input id="accept" type="checkbox"> Li os termos e autorizo o pagamento real deste plano, com renovação manual.</label><button id="create" disabled>Gerar pagamento real</button></article><article id="checkout" hidden><h2>Seu pagamento</h2><p id="payment"></p><p><a id="checkout-terms" target="_blank" rel="noopener" hidden>Termos desta contratação</a></p><a id="open" target="_blank" rel="noopener" hidden>Abrir pagamento no Mercado Pago ↗</a><button id="verify">Conferir pagamento</button></article><button id="reload">Atualizar</button><button id="logout" class="secondary">Sair desta conta</button></section><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="/pagamento/app.mjs?v=termos-versionados2"></script></body></html>
